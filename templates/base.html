<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Nexus</title>

    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Tailwind & AOS & Lucide & Choices -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        dark: '#0a0a0b',
                        surface: 'rgba(255, 255, 255, 0.03)',
                        surfaceHover: 'rgba(255, 255, 255, 0.06)',
                        border: 'rgba(255, 255, 255, 0.08)',
                        brand: {
                            blue: '#4F46E5',
                            purple: '#9333EA',
                            glow: 'rgba(79, 70, 229, 0.4)'
                        }
                    },
                    backgroundImage: {
                        'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
                        'gradient-glow': 'linear-gradient(135deg, #4F46E5 0%, #9333EA 100%)',
                        'glass-gradient': 'linear-gradient(145deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%)'
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0a0a0b;
            color: #ececf1;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Custom Sleek Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0b; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

        /* High-End Glassmorphism */
        .glass-panel {
            background: linear-gradient(145deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.01) 100%);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3), inset 0 1px 0 0 rgba(255,255,255,0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-panel:hover {
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.4), inset 0 1px 0 0 rgba(255,255,255,0.1);
        }

        /* Refined Abstract Background Orbs */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            opacity: 0.15;
            pointer-events: none;
        }
        .orb-1 { width: 60vw; height: 60vw; background: #4F46E5; top: -20%; left: -10%; animation: pulse 15s infinite alternate; }
        .orb-2 { width: 50vw; height: 50vw; background: #9333EA; bottom: -20%; right: -10%; animation: pulse 20s infinite alternate-reverse; }

        @keyframes pulse {
            0% { transform: scale(1) translate(0, 0); opacity: 0.1; }
            100% { transform: scale(1.2) translate(5%, 5%); opacity: 0.2; }
        }

        /* Animated Text Gradient */
        .text-gradient-animated {
            background: linear-gradient(to right, #fff, #a5b4fc, #d8b4fe, #fff);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            animation: shine 4s linear infinite;
        }
        @keyframes shine { to { background-position: 200% center; } }

        /* Premium Form Inputs */
        input, select {
            background: rgba(0, 0, 0, 0.4) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
            transition: all 0.2s ease;
        }
        input:focus, select:focus {
            border-color: #4F46E5 !important;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2), 0 0 0 2px rgba(79, 70, 229, 0.2) !important;
            outline: none !important;
        }

        /* Choices.js High-End Overrides */
        .choices__inner {
            background-color: rgba(0,0,0,0.4) !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
            border-radius: 0.5rem !important;
            min-height: 42px;
            color: white !important;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
            transition: all 0.2s ease;
        }
        .choices.is-focused .choices__inner {
            border-color: #4F46E5 !important;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2), 0 0 0 2px rgba(79, 70, 229, 0.2) !important;
        }
        .choices__input { background-color: transparent !important; color: white !important; }
        .choices__list--dropdown {
            background-color: #121214 !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
            border-radius: 0.5rem !important;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            color: white;
            z-index: 50 !important;
        }
        .choices__list--dropdown .choices__item--selectable.is-highlighted { background-color: rgba(79, 70, 229, 0.2) !important; color: white; }
        .choices__item--choice { color: rgba(255,255,255,0.8) !important; font-size: 0.9rem; }
        .choices[data-type*="select-multiple"] .choices__button { border-left: 1px solid rgba(255,255,255,0.1) !important; }
        .choices[data-type*="select-multiple"] .choices__inner .choices__item {
            background: linear-gradient(135deg, rgba(79,70,229,0.8), rgba(147,51,234,0.8)) !important;
            border: 1px solid rgba(255,255,255,0.2) !important;
            border-radius: 6px;
            font-weight: 500;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center relative font-sans">
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    {% block content %}{% endblock %}

    <script>
        lucide.createIcons();
        AOS.init({ once: true, offset: 50, duration: 800, easing: 'ease-out-cubic' });

        document.addEventListener('DOMContentLoaded', function() {
            const elements = document.querySelectorAll('.js-choice');
            elements.forEach(el => {
                new Choices(el, {
                    removeItemButton: true,
                    searchPlaceholderValue: "Search...",
                    shouldSort: false,
                    itemSelectText: ''
                });
            });
        });
    </script>
</body>
</html>
