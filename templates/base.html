<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Nexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>

    <style>
        body { background-color: #1E1F22; color: white; overflow-x: hidden; }

        /* Modern Glassmorphic Dashboard */
        .glass-panel {
            background: rgba(43, 45, 49, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
        }

        /* Animated Background Orbs */
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.5;
            animation: float 20s infinite alternate;
        }
        .orb-1 { width: 400px; height: 400px; background: #5865F2; top: -10%; left: -10%; }
        .orb-2 { width: 500px; height: 500px; background: #EB459E; bottom: -10%; right: -10%; animation-delay: -5s; }
        .orb-3 { width: 300px; height: 300px; background: #57F287; top: 40%; left: 40%; animation-delay: -10s; opacity: 0.3; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        /* Choices.js Dark Theme Overrides */
        .choices__inner {
            background-color: rgba(0,0,0,0.4) !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
            border-radius: 0.5rem !important;
            min-height: 42px;
            color: white !important;
        }
        .choices.is-focused .choices__inner {
            border-color: #5865F2 !important;
        }
        .choices__input {
            background-color: transparent !important;
            color: white !important;
        }
        .choices__list--dropdown {
            background-color: #2B2D31 !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
            border-radius: 0.5rem !important;
            color: white;
            z-index: 50 !important;
        }
        .choices__list--dropdown .choices__item--selectable.is-highlighted {
            background-color: #5865F2 !important;
        }
        .choices__item--choice {
            color: white !important;
        }
        .choices[data-type*="select-multiple"] .choices__button, .choices[data-type*="text"] .choices__button {
            border-left: 1px solid rgba(255,255,255,0.2) !important;
        }
        .choices[data-type*="select-multiple"] .choices__button:hover {
            background-color: rgba(255,255,255,0.1) !important;
        }
        .choices__item--selectable {
            border-radius: 4px !important;
        }
        .choices[data-type*="select-multiple"] .choices__inner .choices__item {
            background-color: #5865F2 !important;
            border: none !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center relative">
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    {% block content %}{% endblock %}

    <script>
        lucide.createIcons();

        // Initialize all select elements with class 'js-choice'
        document.addEventListener('DOMContentLoaded', function() {
            const elements = document.querySelectorAll('.js-choice');
            elements.forEach(el => {
                new Choices(el, {
                    removeItemButton: true,
                    searchPlaceholderValue: "Search...",
                    shouldSort: false
                });
            });
        });
    </script>
</body>
</html>
